# The apps the Receipts Library installs on fresh GitHub runners, one [[app]] per winget id.
# `name` is passed to `idiff run --app`, so it's the name the app calls itself.
#
# Not listed: apps the windows-2025 runner image already has (7-Zip, Git, Python, Node.js,
# Chrome, Firefox, Edge, Docker, Java), which would be upgrades, not installs. Also not listed:
# apps that can't install on Windows Server as administrator (Battle.net, CCleaner, Spotify) or
# whose installer hangs there (Ubisoft Connect).

# Tested in the kill test.
[[app]]
id = "Discord.Discord"
name = "Discord"

