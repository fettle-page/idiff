# Every push and pull request: formatting, lints, all tests, and the check that the collector only reads.
name: CI

on:
  # Branches only: a version tag's commit has already been tested on its branch, and the
  # release workflow runs the tests again. The catalog's receipts branches hold only pages.
  push:
    branches: ["**", "!receipts/**"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch replaces an older run that's still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2025
    # The exact Rust version for every cargo command here (rust-toolchain.toml says "stable" for local builds).
    env:
      RUSTUP_TOOLCHAIN: "1.99.0-x86_64-pc-windows-msvc"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token needn't stay where cargo build scripts can read it.
          persist-credentials: false
      - run: rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal --component clippy,rustfmt
      # idiff-collect never writes to the registry or the disk: any write call in it fails the run.
      - name: idiff-collect only reads
        shell: pwsh
        run: |
          $hits = git grep -nE "create_subkey|set_value|set_raw_value|delete_value|delete_subkey|remove_file|remove_dir|fs::write|File::create|OpenOptions" -- crates/idiff-collect
          # git grep exits 1 when nothing matches, which is the good case.
          if ($hits) { $hits; exit 1 }
          exit 0
      - run: cargo fmt --all --check
      # Every test program runs, so one run shows every failure.
      - run: cargo test --workspace --locked --no-fail-fast
      # Rust's own lints: any warning fails the run.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Real installs on a fresh runner: `idiff run` with VLC, checked against what VLC is known to
  # add, and PuTTY installed and uninstalled for `idiff leftovers`. Installs only ever happen
  # here, never on a developer's PC.
  smoke:
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: "1.99.0-x86_64-pc-windows-msvc"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal
      # The runner image has no winget, and Repair-WinGetPackageManager -AllUsers fails on Server 2025.
      - name: Install winget
        shell: pwsh
        env:
          # Only for the GitHub API's rate limit when the script looks up winget's latest release.
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-winget.ps1
      - run: cargo build --release --locked
      # Runners are administrators, so there's no UAC prompt; --yes waits instead of asking.
      - name: idiff run with VLC
        shell: pwsh
        run: |
          target\release\idiff.exe run --yes --settle 5 --app VLC -- winget install --id VideoLAN.VLC --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The receipt has what VLC adds
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $receipt = target\release\idiff.exe show last --json | Out-String | ConvertFrom-Json
          $texts = @($receipt.lines | ForEach-Object text)
          $texts
          if ('Adds right-click menu entries' -notin $texts) { throw 'No "Adds right-click menu entries" line' }
          if (-not ($texts | Where-Object { $_.StartsWith('Files in Program Files (') })) { throw 'No "Files in Program Files (" line' }
      - name: Save the VLC receipt
        if: always()
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          target\release\idiff.exe show last --all --why | Out-File -Encoding utf8 smoke-vlc.txt
          target\release\idiff.exe export last --format json --no-redact -o smoke-vlc.json
      # VLC isn't uninstalled here: its uninstaller hangs on runners (at a dialog nobody can click).
      # PuTTY's MSI uninstalls silently, so it checks `leftovers` against a real, finished uninstall.
      - name: idiff run with PuTTY
        shell: pwsh
        run: |
          target\release\idiff.exe run --yes --settle 5 --app PuTTY -- winget install --id PuTTY.PuTTY --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Exit 2 means the uninstall failed or was still running after 10 minutes.
      - name: idiff leftovers after uninstalling PuTTY
        shell: pwsh
        run: |
          target\release\idiff.exe leftovers last --yes --timeout 10 -- winget uninstall --id PuTTY.PuTTY --exact --silent --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # `show --json` is the install receipt only; the export has both.
      - name: The export has PuTTY's leftovers receipt
        shell: pwsh
        run: |
          target\release\idiff.exe export last --format json --no-redact -o smoke-putty.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $export = Get-Content -Raw -Encoding utf8 smoke-putty.json | ConvertFrom-Json
          $export.leftovers.title
          if (-not $export.leftovers -or $export.leftovers.title -notlike '*after uninstall*') { throw 'No leftovers receipt in the export' }
          # A finished uninstall removes PuTTY's own program entry. If it's still listed, idiff
          # looked before the uninstaller had finished.
          $still = @($export.leftovers.lines | Where-Object { $_.text.StartsWith('Program "PuTTY') })
          if ($still) { $still.text; throw 'PuTTY''s program entry is still there: the leftovers snapshot came too early' }
      - name: Save the PuTTY receipts
        if: always()
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          target\release\idiff.exe show last --all --why | Out-File -Encoding utf8 smoke-putty.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-receipts
          path: |
            smoke-vlc.txt
            smoke-vlc.json
            smoke-putty.txt
            smoke-putty.json
          if-no-files-found: warn
