# Every push and pull request: formatting, lints, all tests, and the check that the collector only reads.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch replaces an older run that's still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2025
    # The exact Rust version for every cargo command here (rust-toolchain.toml says "stable" for local builds).
    env:
      RUSTUP_TOOLCHAIN: "1.99.0-x86_64-pc-windows-msvc"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token needn't stay where cargo build scripts can read it.
          persist-credentials: false
      - run: rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal --component clippy,rustfmt
      # idiff-collect never writes to the registry or the disk: any write call in it fails the run.
      - name: idiff-collect only reads
        shell: pwsh
        run: |
          $hits = git grep -nE "create_subkey|set_value|set_raw_value|delete_value|delete_subkey|remove_file|remove_dir|fs::write|File::create|OpenOptions" -- crates/idiff-collect
          # git grep exits 1 when nothing matches, which is the good case.
          if ($hits) { $hits; exit 1 }
          exit 0
      - run: cargo fmt --all --check
      # Every test program runs, so one run shows every failure.
      - run: cargo test --workspace --locked --no-fail-fast
      # Rust's own lints: any warning fails the run.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # A real install on a fresh runner: `idiff run` with VLC, checked against what VLC is known to
  # add. Installs only ever happen here, never on a developer's PC.
  smoke:
    runs-on: windows-2025
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: "1.99.0-x86_64-pc-windows-msvc"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal
      # The runner image has no winget, and Repair-WinGetPackageManager -AllUsers fails on Server 2025.
      - name: Install winget
        shell: pwsh
        env:
          # Only for the GitHub API's rate limit when the script looks up winget's latest release.
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-winget.ps1
      - run: cargo build --release --locked
      # Runners are administrators, so there's no UAC prompt; --yes waits instead of asking.
      - name: idiff run with VLC
        shell: pwsh
        run: |
          target\release\idiff.exe run --yes --settle 5 --app VLC -- winget install --id VideoLAN.VLC --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The receipt has what VLC adds
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $receipt = target\release\idiff.exe show last --json | Out-String | ConvertFrom-Json
          $texts = @($receipt.lines | ForEach-Object text)
          $texts
          if ('Adds right-click menu entries' -notin $texts) { throw 'No "Adds right-click menu entries" line' }
          if (-not ($texts | Where-Object { $_.StartsWith('Files in Program Files (') })) { throw 'No "Files in Program Files (" line' }
      - name: Save the install receipt
        if: always()
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          target\release\idiff.exe show last --all --why | Out-File -Encoding utf8 smoke-receipt.txt
      # The exit code is the uninstall command's; what VLC leaves behind is on the receipt.
      - name: idiff leftovers after uninstalling VLC
        shell: pwsh
        run: |
          target\release\idiff.exe leftovers last --yes -- winget uninstall --id VideoLAN.VLC --exact --silent --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # `show --json` is the install receipt only; the export has both.
      - name: The export has the leftovers receipt
        shell: pwsh
        run: |
          target\release\idiff.exe export last --format json --no-redact -o smoke-export.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $export = Get-Content -Raw -Encoding utf8 smoke-export.json | ConvertFrom-Json
          $export.leftovers.title
          if (-not $export.leftovers -or $export.leftovers.title -notlike '*after uninstall*') { throw 'No leftovers receipt in the export' }
      - name: Add the leftovers to the saved receipt
        if: always()
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          "`n==== after idiff leftovers ====`n" | Out-File -Encoding utf8 -Append smoke-receipt.txt
          target\release\idiff.exe show last --all --why | Out-File -Encoding utf8 -Append smoke-receipt.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-receipt
          path: |
            smoke-receipt.txt
            smoke-export.json
          if-no-files-found: warn
