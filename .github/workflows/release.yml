# A version tag (v0.9.0) builds the download here, in the open, from that tag's source: the zip and
# SHA256SUMS.txt, with a build attestation. It makes a draft release; a maintainer reads it and
# publishes it.
#
# Two jobs: "build" runs every build script (cargo) and can only read the repository; "publish"
# holds the write rights and runs none of them. It only checks the files against SHA256SUMS.txt,
# attests them and drafts the release.
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  RUSTUP_TOOLCHAIN: "1.99.0-x86_64-pc-windows-msvc"

jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token needn't stay where cargo build scripts can read it.
          persist-credentials: false
      - run: rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal
      # Every test program runs, so one run shows every failure.
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downloads
          path: |
            target/package/idiff-*-x64.zip
            target/package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: downloads
          path: downloads

      # The files must be exactly what the build made.
      - working-directory: downloads
        run: sha256sum -c SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: downloads/idiff-*-x64.zip

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in 0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft $prerelease --title "Install diff $version" \
            --notes "Unsigned for now. Check the download against SHA256SUMS.txt and the build attestation." \
            "downloads/idiff-$version-x64.zip" downloads/SHA256SUMS.txt
