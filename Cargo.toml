[workspace]
resolver = "3"
members = ["crates/idiff-core", "crates/idiff-collect", "apps/idiff", "tools/library"]

[workspace.package]
version = "0.9.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
idiff-core = { path = "crates/idiff-core" }
idiff-collect = { path = "crates/idiff-collect" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regex = "1.13.1"
toml = "1.1.7"
roxmltree = "0.21.1"
clap = { version = "4", features = ["derive"] }
winreg = "0.56.0"
windows = "0.62.2"
tempfile = "3.27.0"
